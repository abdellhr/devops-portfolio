---
- name: Déployer la stack DevOps Portfolio sur un serveur cible
  hosts: docker_hosts
  become: true

  vars:
    project_dir: /opt/devops-portfolio

  tasks:
    - name: Mettre à jour le cache apt
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installer les paquets prérequis
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
        state: present

    - name: Ajouter la clé GPG officielle de Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Ajouter le dépôt Docker
      apt_repository:
        repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Installer Docker Engine et le plugin Compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: S'assurer que le service Docker est démarré et actif
      service:
        name: docker
        state: started
        enabled: true

    - name: Ajouter l'utilisateur de déploiement au groupe docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Créer le répertoire du projet
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"

    - name: Copier les fichiers du projet sur le serveur
      synchronize:
        src: ../
        dest: "{{ project_dir }}/"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.terraform"

    - name: Lancer la stack via Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        state: present
